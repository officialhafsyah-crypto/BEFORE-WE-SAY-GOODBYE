*{box-sizing:border-box;margin:0;padding:0}

body{
    overflow:hidden;
    background:#050609;
    color:white;
    font-family:Georgia,serif;
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
    transition:background 1.2s ease;
}

/* =========================
   BACKGROUND
========================= */

.background{
    position:absolute;
    inset:0;
    transition:1.2s;
}

.sky{
    position:absolute;
    inset:0;
    transition:1.2s;
}

.horizon{
    position:absolute;
    bottom:0;
    width:100%;
    height:45%;
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.75)
    );
}

.sun{
    position:absolute;
    width:90px;
    height:90px;
    border-radius:50%;
    left:75%;
    top:18%;
    transition:1s;
}

.objects{
    position:absolute;
    inset:0;
}

/* Scene objects */

.school{
    position:absolute;
    bottom:22%;
    left:8%;
    width:84%;
    height:28%;
    background:#252a34;
    border-radius:8px 8px 0 0;
    display:none;
}

.school:before{
    content:"SEKOLAH";
    position:absolute;
    top:20px;
    width:100%;
    text-align:center;
    font-size:25px;
    letter-spacing:5px;
}

.window{
    position:absolute;
    width:10%;
    height:35%;
    background:#111822;
    border:3px solid #555d6b;
    bottom:20%;
}

.w1{left:8%}.w2{left:25%}.w3{left:42%}
.w4{left:59%}.w5{left:76%}

.city{
    position:absolute;
    bottom:20%;
    left:0;
    width:100%;
    height:35%;
    display:none;
    align-items:end;
    gap:5px;
}

.building{
    width:8%;
    background:#11151e;
}

.tree{
    position:absolute;
    bottom:18%;
    width:25px;
    height:120px;
    background:#33251c;
    display:none;
}

.tree:before{
    content:"";
    position:absolute;
    width:110px;
    height:100px;
    border-radius:50%;
    background:#172a20;
    left:-42px;
    top:-65px;
}

.t1{left:15%}.t2{left:80%}

.beach{
    position:absolute;
    bottom:0;
    width:100%;
    height:42%;
    display:none;
    background:linear-gradient(
        #b79d76,
        #76644f
    );
}

.sea{
    position:absolute;
    bottom:25%;
    width:100%;
    height:30%;
    display:none;
    background:
        repeating-linear-gradient(
            0deg,
            #314d62 0px,
            #314d62 8px,
            #46657a 10px,
            #46657a 13px
        );
}

.station{
    position:absolute;
    bottom:20%;
    left:8%;
    width:84%;
    height:30%;
    background:#252a31;
    display:none;
}

.station:before{
    content:"STATION";
    position:absolute;
    width:100%;
    text-align:center;
    top:20px;
    font-size:30px;
    letter-spacing:8px;
}

/* =========================
   RAIN
========================= */

#rain{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0;
    transition:opacity 1s;
}

.drop{
    position:absolute;
    width:1px;
    height:20px;
    background:rgba(210,225,255,.4);
    transform:rotate(15deg);
    animation:rain .7s linear infinite;
}

@keyframes rain{
    from{transform:translateY(-40px) rotate(15deg)}
    to{transform:translateY(110vh) rotate(15deg)}
}

/* =========================
   CHARACTER
========================= */

.character{
    position:absolute;
    width:90px;
    height:180px;
    bottom:22%;
    left:50%;
    transform:translateX(-50%);
    transition:1s;
    z-index:4;
}

.head{
    position:absolute;
    width:53px;
    height:58px;
    border-radius:50%;
    left:18px;
    top:0;
    background:#c99372;
}

.hair{
    position:absolute;
    width:60px;
    height:45px;
    border-radius:50% 50% 30% 30%;
    left:15px;
    top:-4px;
    background:#17151a;
}

.body{
    position:absolute;
    width:65px;
    height:85px;
    left:13px;
    top:55px;
    border-radius:20px 20px 5px 5px;
    background:#263247;
}

.arm{
    position:absolute;
    width:15px;
    height:65px;
    top:60px;
    background:#1c2431;
    border-radius:10px;
}

.a1{left:3px;transform:rotate(8deg)}
.a2{right:3px;transform:rotate(-8deg)}

.leg{
    position:absolute;
    width:18px;
    height:65px;
    background:#11151d;
    top:130px;
    border-radius:8px;

.l1{left:20px}.l2{right:20px}

/* =========================
   START
========================= */

#start{

    inset:0;
    z-index:20;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    padding:25px;

    letter-spacing:6px;
    text-transform:uppercase;
    text-shadow:0 0 30px rgba(180,200,255,.25);
}

#start p{
    margin:15px 0 35px;
    color:#aab4c5;
    font-style:italic;
}

button{
    border:1px solid rgba(180,200,230,.3);
    background:rgba(20,27,40,.85);
    color:white;
    border-radius:8px;
    padding:13px 20px;
    margin:5px;
    cursor:pointer;
    font-family:inherit;
    transition:.25s;
}

button:hover{
    background:#344158;
    transform:translateY(-2px);
}

.startButton{
    font-size:17px;
    padding:16px 35px;
    letter-spacing:2px;
}

/* =========================
   UI
========================= */

#ui{

    z-index:10;

.top{

    justify-content:space-between;
    font-family:Arial,sans-serif;
    font-size:12px;

.stats{

.stat{
    background:rgba(4,7,12,.65);

    padding:7px 10px;
    border-radius:6px;

.dialog{
    position:absolute;

    left:50%;

.speaker{

.text{

.choices{

.choice{

@media(max-width:600px){
    .text{font-size:16px}
    .choice{min-width:100%}

/* =========================================
   START GAME
========================================= */

function startGame(){

    scene=0;
    memory=0;
    courage=0;
    inventory=[];

    document.getElementById("start").style.display="none";
    document.getElementById("ui").style.display="block";
    document.getElementById("ending").style.display="none";

    showScene();
}


/* =========================================
   MUSIC
========================================= */

function openMusic(){

    window.open(spotify,"_blank");

}


/* =========================================
   BACKGROUND SYSTEM
========================================= */

function changeBackground(location){

    const sky=document.getElementById("sky");
    const sun=document.getElementById("sun");

    document.querySelector(".school").style.display="none";
    document.getElementById("city").style.display="none";
    document.querySelectorAll(".tree")
        .forEach(x=>x.style.display="none");
    document.querySelector(".sea").style.display="none";
    document.querySelector(".beach").style.display="none";
    document.querySelector(".station").style.display="none";

    document.getElementById("rain").style.opacity="0";


    if(location==="Halte Kota"){

        sky.style.background=
        "linear-gradient(#27364b,#0b101a)";

        sun.style.background="#b8c4d6";

        document.getElementById("city").style.display="flex";

        document.getElementById("rain").style.opacity=".5";

    }

    else if(location==="Jalan Kota"){

        sky.style.background=
        "linear-gradient(#182538,#05070d)";

        sun.style.background="#68758a";

        document.getElementById("city").style.display="flex";

    }

    else if(location==="Sekolah Lama" ||
            location==="Kelas Lama"){

        sky.style.background=
        "linear-gradient(#42516a,#17202e)";

        sun.style.background="#d1b982";

        document.querySelector(".school")
            .style.display="block";

    }

    else if(location==="Taman Kota"){

        sky.style.background=
        "linear-gradient(#63758a,#293c42)";

        sun.style.background="#e4c978";

        document.querySelectorAll(".tree")
            .forEach(x=>x.style.display="block");

    }

    else if(location==="Rumah Lama"){

        sky.style.background=
        "linear-gradient(#111927,#030509)";

        sun.style.background="#59677a";

        document.getElementById("rain")
            .style.opacity=".7";

    }

    else if(location==="Stasiun"){

        sky.style.background=
        "linear-gradient(#182132,#05070c)";

        sun.style.background="#b7a477";

        document.querySelector(".station")
            .style.display="block";

    }

    else if(location==="Kereta"){

        sky.style.background=
        "linear-gradient(#10131a,#030405)";

        sun.style.background="#444";

    }

    else if(location==="Pantai"){

        sky.style.background=
        "linear-gradient(#d48e76,#e2bd8c,#4d6f82)";

        sun.style.background="#ffd28a";

        document.querySelector(".sea")
            .style.display="block";

        document.querySelector(".beach")
            .style.display="block";

    }

    else{

        sky.style.background=
        "linear-gradient(#39485c,#070a10)";

        sun.style.background="#d7c48e";

    }

}


/* =========================================
   SHOW SCENE
========================================= */

function showScene(){

    if(!story[scene]){
        ending();
        return;
    }

    const s=story[scene];

    document.getElementById("chapter")
        .textContent=s.chapter;

    document.getElementById("location")
        .textContent=s.location;

    document.getElementById("speaker")
        .textContent=s.speaker;

    const text=document.getElementById("text");
    const choices=document.getElementById("choices");

    text.textContent="";
    choices.innerHTML="";

    changeBackground(s.location);

    typeText(
        s.text,
        text,
        ()=>{
            s.choices.forEach(c=>{

                const btn=document.createElement("button");

                btn.className="choice";
                btn.textContent=c[0];

                btn.onclick=()=>{

                    memory+=c[2];
                    courage+=c[3];

                    scene=c[1];

                    updateUI();
                    showScene();

                };

                choices.appendChild(btn);

            });
        }
    );

}


/* =========================================
   TYPEWRITER
========================================= */

function typeText(text,element,done){

    let i=0;

    function write(){

        if(i<text.length){

            element.textContent+=text[i];

            i++;

            setTimeout(write,15);

        }else{

            done();

        }

    }

    write();

}


/* =========================================
   UI
========================================= */

function updateUI(){

    document.getElementById("memory")
        .textContent=memory;

    document.getElementById("courage")
        .textContent=courage;

    document.getElementById("item")
        .textContent=
        inventory.length?
        inventory[inventory.length-1]:
        "Kosong";

}


/* =========================================
   ENDING
========================================= */

function ending(){

    document.getElementById("ui")
        .style.display="none";

    document.getElementById("ending")
        .style.display="flex";

    let title;
    let text;


    /* ENDING 1 */

    if(memory>=28 && courage>=25){

        title="ENDING · WE FOUND OUR WAY";

        text=
        "Kamu tidak menemukan Raka. " +
        "Namun kamu menemukan sesuatu yang lebih penting: " +
        "alasan untuk berhenti menyalahkan dirimu sendiri. " +
        "Ada orang yang pergi dari hidup kita bukan untuk dilupakan, " +
        "melainkan untuk mengajarkan bahwa kita harus terus berjalan.";


    /* ENDING 2 */

    }else if(memory>=23 && courage>=18){

        title="ENDING · THE LAST PROMISE";

        text=
        "Kamu menepati janji yang pernah dibuat bertahun-tahun lalu. " +
        "Bukan dengan tetap bersama selamanya, tetapi dengan kembali " +
        "ke tempat kalian pernah bermimpi. " +
        "Beberapa janji memang berakhir ketika kita akhirnya mengerti maknanya.";


    /* ENDING 3 */

    }else if(courage>=18){

        title="ENDING · NEW CHAPTER";

        text=
        "Kamu tidak mendapatkan semua jawaban. " +
        "Tetapi kamu memutuskan bahwa hidupmu tidak boleh berhenti " +
        "hanya karena seseorang memilih pergi. " +
        "Pagi baru menunggumu.";


    /* ENDING 4 */

    }else if(memory>=20){

        title="ENDING · MEMORY";

        text=
        "Kamu membawa semua kenangan itu bersamamu. " +
        "Tidak semuanya indah, tetapi semuanya pernah menjadi bagian " +
        "dari hidupmu. Dan mungkin itu sudah cukup.";


    /* BAD ENDING */

    }else{

        title="ENDING · BEFORE GOODBYE";

        text=
        "Kamu pergi sebelum menemukan seluruh jawabannya. " +
        "Mungkin beberapa tahun lagi kamu akan kembali. " +
        "Mungkin tidak. Yang jelas, cerita kalian belum benar-benar selesai.";

    }


    document.getElementById("endingTitle")
        .textContent=title;

    document.getElementById("endingText")
        .textContent=text;

    document.getElementById("endingStats")
        .textContent=
        "Memory: "+memory+
        "  •  Courage: "+courage;

}


/* =========================================
   RESTART
========================================= */

function restart(){

    scene=0;
    memory=0;
    courage=0;
    inventory=[];

    document.getElementById("ending")
        .style.display="none";

    document.getElementById("start")
        .style.display="flex";

    updateUI();

}
